name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: ***

concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: cd wt-experience && npm ci

      - name: Build Next.js application
        run: cd wt-experience && npm run build

      - name: Export static site
        run: cd wt-experience && npx next export

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./wt-experience/out
          keep_files: false
          force_orphan: true
EOF && \
echo "=== 差分確認 ===" && \
git diff .github/workflows/deploy.yml && \
echo "" && \
echo "=== コミット & プッシュ ===" && \
git add .github/workflows/deploy.yml && \
git commit -m "fix: remove cache: npm from setup-node to stop it looking for package-lock.json at root" && \
git push origin main && \
echo "=== 数十秒待機後 Actions 確認 ===" && \
sleep 45 && \
gh run list --limit 3 --json databaseId,status,conclusion,headBranch,workflowName,number --jq '.[] | "● #\(.number) \(.workflowName) \(.status) \(.conclusion) head=\(.headBranch) databaseId=\(.databaseId)"'
